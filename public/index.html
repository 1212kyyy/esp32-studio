<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <title>ESP32 Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="ambient-glow"></div>
  <header class="toolbar">
    <div class="toolbar-left">
      <button class="tool-btn menu-btn" onclick="toggleSidebar()"><i class="fas fa-layer-group"></i></button>
      <div class="brand">
        <div class="brand-icon"><i class="fas fa-microchip"></i></div>
        <span class="brand-text">ESP32<span class="brand-accent">Studio</span></span>
      </div>
    </div>
    <div class="toolbar-center">
      <div class="file-badge" id="fileBadge">
        <i class="fas fa-file-code"></i>
        <span id="currentSketchName">untitled</span>
        <span class="status-indicator" id="statusDot"></span>
      </div>
    </div>
    <div class="toolbar-right">
      <button class="action-btn save-btn" onclick="saveSketch()" title="Save"><i class="fas fa-check"></i><span class="action-label">Save</span></button>
      <button class="action-btn compile-btn" onclick="compileSketch()" title="Build"><i class="fas fa-hammer"></i><span class="action-label">Build</span></button>
      <button class="action-btn upload-btn" onclick="uploadSketch()" title="Flash"><i class="fas fa-bolt"></i><span class="action-label">Flash</span></button>
    </div>
  </header>
  <aside class="drawer" id="drawer">
    <div class="drawer-backdrop" onclick="toggleSidebar()"></div>
    <div class="drawer-panel">
      <div class="drawer-head">
        <div class="drawer-title"><div class="drawer-logo"><i class="fas fa-microchip"></i></div><div><strong>ESP32 Studio</strong><br><small class="text-dim">v1.0 â€” IoT IDE</small></div></div>
        <button class="tool-btn" onclick="toggleSidebar()"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="drawer-body">
        <button class="new-sketch-btn" onclick="newSketch()"><i class="fas fa-plus"></i> New Sketch</button>
        <div class="drawer-section">
          <div class="section-label"><i class="fas fa-folder-open"></i> My Sketches</div>
          <div id="sketchList" class="item-list"><div class="empty-state">No sketches yet</div></div>
        </div>
        <div class="drawer-section">
          <div class="section-label"><i class="fas fa-shapes"></i> Templates</div>
          <div id="templateList" class="item-list"><div class="empty-state">Loadingâ€¦</div></div>
        </div>
        <div class="drawer-section">
          <div class="section-label"><i class="fas fa-server"></i> Home Server</div>
          <div class="config-group">
            <label class="config-label">Server Host / IP</label>
            <input type="text" id="serverHostInput" class="config-input" placeholder="http://192.168.1.100:3456" onchange="updateServerUrl()">
          </div>
        </div>
        <div class="drawer-section">
          <div class="section-label"><i class="fas fa-sliders"></i> Configuration</div>
          <div class="config-group"><label class="config-label">Target Board</label><div class="select-wrap"><select id="boardSelect"><option value="esp32:esp32:esp32">ESP32 Dev Module</option></select><i class="fas fa-chevron-down select-arrow"></i></div></div>
          <div class="config-group">
            <label class="config-label">Upload Mode</label>
            <div class="mode-toggle">
              <button class="mode-btn active" id="modeWifi" onclick="setUploadMode('wifi')"><i class="fas fa-wifi"></i> WiFi OTA</button>
              <button class="mode-btn" id="modeUsb" onclick="setUploadMode('usb')"><i class="fas fa-usb"></i> USB Direct</button>
            </div>
          </div>
          <div id="wifiConfig">
            <div class="config-group"><label class="config-label">ESP32 IP Address</label><input type="text" id="espIpInput" class="config-input" placeholder="192.168.1.xxx"></div>
            <div class="config-group"><label class="config-label">OTA Port</label><input type="number" id="espPortInput" class="config-input" placeholder="3232" value="3232"></div>
          </div>
          <div id="usbConfig" style="display:none">
            <div class="usb-status-card" id="usbStatusCard">
              <i class="fas fa-usb"></i> <span id="usbStatusText">No device connected</span>
            </div>
            <button class="config-btn" onclick="connectUSB()"><i class="fas fa-plug"></i> Connect ESP32 via USB</button>
          </div>
        </div>
        <div class="drawer-section"><div id="cliStatus" class="status-card"><i class="fas fa-circle-notch fa-spin"></i> Checking Arduino CLIâ€¦</div></div>
      </div>
    </div>
  </aside>
  <main class="workspace">
    <div class="editor-wrap" id="editorWrap"><textarea id="codeEditor"></textarea></div>
    <div class="panel-resizer" id="panelResizer"></div>
    <div class="bottom-panel" id="bottomPanel">
      <div class="panel-bar">
        <div class="panel-tabs">
          <button class="ptab active" onclick="switchTab('console')" id="tabConsole"><i class="fas fa-terminal"></i> Output</button>
          <button class="ptab" onclick="switchTab('serial')" id="tabSerial"><i class="fas fa-wave-square"></i> Serial</button>
        </div>
        <div class="panel-actions">
          <button class="tool-btn mini" onclick="clearConsole()" title="Clear"><i class="fas fa-broom"></i></button>
          <button class="tool-btn mini" onclick="togglePanel()" title="Toggle"><i class="fas fa-chevron-down" id="panelToggleIcon"></i></button>
        </div>
      </div>
      <div class="panel-body" id="consolePanel">
        <div class="console-out" id="consoleOutput"><p class="c-success"><i class="fas fa-rocket"></i> ESP32 Studio ready.</p></div>
      </div>
      <div class="panel-body hidden" id="serialPanel">
        <div class="serial-bar">
          <div class="select-wrap compact"><select id="serialPort"><option value="">â€” port â€”</option></select><i class="fas fa-chevron-down select-arrow"></i></div>
          <div class="select-wrap compact"><select id="serialBaud"><option value="9600">9600</option><option value="115200" selected>115200</option><option value="230400">230400</option></select><i class="fas fa-chevron-down select-arrow"></i></div>
          <button class="serial-toggle" id="serialConnectBtn" onclick="toggleSerial()"><i class="fas fa-plug-circle-bolt"></i> Connect</button>
        </div>
        <div class="console-out" id="serialOutput"></div>
        <div class="serial-send"><input type="text" id="serialInput" placeholder="Type commandâ€¦" onkeydown="if(event.key==='Enter')sendSerial()"><button class="send-btn" onclick="sendSerial()"><i class="fas fa-paper-plane"></i></button></div>
      </div>
    </div>
  </main>
  <div class="modal-overlay" id="uploadModal"><div class="modal-card"><div class="modal-icon upload-anim"><i class="fas fa-cloud-arrow-up" id="uploadModalIcon"></i></div><h3 id="uploadModalTitle">Flashing to ESP32</h3><div class="progress-track"><div class="progress-thumb" id="uploadProgressFill"></div></div><p class="modal-status" id="uploadStatus">Preparing...</p><div id="uploadLog" class="upload-log"></div><button class="modal-btn" onclick="closeModal('uploadModal')">Close</button></div></div>
  <div class="modal-overlay" id="newSketchModal"><div class="modal-card"><div class="modal-icon create-anim"><i class="fas fa-file-circle-plus"></i></div><h3>Create New Sketch</h3><input type="text" id="newSketchName" class="modal-input" placeholder="my_project"><div class="modal-actions"><button class="modal-btn primary" onclick="createSketch()"><i class="fas fa-plus"></i> Create</button><button class="modal-btn ghost" onclick="closeModal('newSketchModal')">Cancel</button></div></div></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
